# Nexzy - Docker Compose Configuration
# For local development and testing

services:
  # AI Service - Port 8000
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: nexzy-ai-service
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
    networks:
      - nexzy-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 120s

  # Backend API - Port 8001
  backend:
    build:
      context: ./nexzy-backend
      dockerfile: Dockerfile
    container_name: nexzy-backend
    ports:
      - "8001:8001"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - TARGET_DOMAIN=${TARGET_DOMAIN:-ui.ac.id}
      - AI_SERVICE_URL=http://ai-service:8000
      - API_HOST=0.0.0.0
      - API_PORT=8001
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    depends_on:
      ai-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nexzy-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend - Port 80
  frontend:
    build:
      context: ./nexzy-frontend
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8001}
    container_name: nexzy-frontend
    ports:
      - "80:80"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8001}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nexzy-network

networks:
  nexzy-network:
    driver: bridge

volumes:
  backend-logs:
